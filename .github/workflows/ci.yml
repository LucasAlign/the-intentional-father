name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  # #41 — first-pass usability regression coverage: signed-out AuthGate,
  # Today's save/failure/retry lifecycle, and a keyboard/accessibility scan
  # of the authenticated app, each across the four mobile widths #41 names.
  # Deliberately not comprehensive yet (see the issue for what's deferred).
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: steward
          POSTGRES_PASSWORD: steward
          POSTGRES_DB: steward_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://steward:steward@localhost:5432/steward_test
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Schema bootstrap: auth/session tables self-create on server boot
      # (index.ts's ensureAuthTables), but the Drizzle-managed app tables
      # (relationships, tasks, commits, ...) need this first, same as any
      # fresh local DB per CLAUDE.md.
      - run: pnpm --filter @workspace/db run push
      - run: pnpm --filter @workspace/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @workspace/e2e run test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
